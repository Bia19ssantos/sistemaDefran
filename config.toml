# .streamlit/config.toml
[theme]
primaryColor = "#007bff"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#31333F"

[server]
headless = true

# Nota: O Streamlit busca automaticamente por 'favicon.ico' 
# na pasta 'static' se configurado, mas o logo na barra 
# lateral é feito via código no app.py.